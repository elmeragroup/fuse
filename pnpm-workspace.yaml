packages:
  - apps/*
  - packages/*
  - tooling/*

catalog:
  "@arethetypeswrong/cli": 0.18.5
  "@changesets/cli": 3.0.2
  "@effect/platform-node": 4.0.2
  "@effect/vitest": 4.0.2
  "@elmeragroup/internal": 0.2.0-canary.10
  "@arethetypeswrong/core": 0.18.5
  "@base-ui/react": 1.8.0
  "@fontsource/jetbrains-mono": 5.3.0
  "@fontsource/roboto": 5.3.0
  "@internationalized/date": 3.12.4
  "@internationalized/string": 3.2.10
  "@paper-design/shaders-react": 0.0.81
  "@phosphor-icons/react": 2.1.10
  # Remotion's packages release together; keep every @remotion entry on one version.
  "@remotion/bundler": 4.0.535
  "@remotion/cli": 4.0.535
  "@remotion/layout-utils": 4.0.535
  "@remotion/media": 4.0.535
  "@remotion/tailwind-v4": 4.0.535
  "@mdx-js/loader": 3.1.1
  "@next/mdx": 16.4.0
  "@next/playwright": 16.4.0
  "@shadcn/lint": 0.1.1
  # satori, which next/og bundles, pins this exact build; the OG card measures text with it.
  "@shuding/opentype.js": 1.4.0-beta.0
  "@tailwindcss/cli": 4.3.3
  "@tailwindcss/postcss": 4.3.3
  "@tailwindcss/webpack": 4.3.3
  "@tailwindcss/typography": 0.5.20
  "@tanstack/react-table": 9.2.4
  "@tanstack/react-virtual": 3.14.13
  "@types/node": 25.9.5
  "@types/picomatch": 4.0.3
  "@types/pngjs": 6.0.5
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  "@vitest/browser-playwright": 5.0.0
  clsx: 2.1.1
  csstype: 3.2.3
  effect: 4.0.2
  eslint-plugin-turbo: 2.10.12
  fast-check: 4.10.2
  "libphonenumber-js": 1.13.13
  next: 16.4.0
  oxc-parser: 0.148.0
  oxc-transform: 0.148.0
  oxfmt: 0.68.0
  oxlint: 1.83.0
  oxlint-tsgolint: 7.0.2001
  picomatch: 4.0.7
  # 8.0.0 is inside the minimum release age; 7.2.0 has the same API for pr-shots.
  pixelmatch: 7.2.0
  playwright: 1.63.0
  plop: 4.0.5
  pngjs: 7.0.0
  publint: 0.3.24
  rolldown: 1.2.8
  "sugar-high": 2.4.1
  react: 19.3.0
  react-aria: 3.52.1
  react-aria-components: 1.21.1
  react-dom: 19.3.0
  remark-frontmatter: 5.0.0
  remark-gfm: 4.0.1
  remotion: 4.0.535
  tailwind-merge: 3.7.0
  tailwind-variants: 3.3.1
  tailwindcss: 4.3.3
  tailwindcss-react-aria-components: 2.2.0
  tsdown: 0.23.0
  turbo: 2.10.12
  tw-animate-css: 1.4.0
  typescript: 7.0.2
  vite: 8.3.0
  vitest: 5.0.0
  yaml: 2.9.1

autoInstallPeers: true

overrides:
  # @effect/platform-node declares a caret range here, which resolves to a release whose
  # effect peer is newer than the catalog's effect. Keep the whole Effect family on one version.
  "@effect/platform-node-shared": 4.0.2
  # @remotion/tailwind-v4 pins Tailwind 4.2.0 for its webpack loader. Fuse's CSS compiles against
  # the catalog Tailwind, so the video app's loader runs the same version.
  "@remotion/tailwind-v4>@tailwindcss/webpack": "catalog:"
  "@remotion/tailwind-v4>tailwindcss": "catalog:"

allowBuilds:
  "@parcel/watcher": true
  # Remotion's bundler runs esbuild through its platform package; the postinstall only re-checks
  # that binary, so it stays off.
  esbuild: false

minimumReleaseAge: 4320

minimumReleaseAgeExclude:
  - effect@4.0.2
  # Canary line of the in-house tooling package; each bump names the exact version.
  - "@elmeragroup/internal@0.2.0-canary.10"
