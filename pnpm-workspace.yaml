packages:
  - apps/*
  - packages/*
  - tooling/*

catalog:
  "@arethetypeswrong/cli": 0.18.5
  "@changesets/cli": 3.0.2
  "@effect/platform-node": 4.0.6
  "@effect/vitest": 4.0.6
  "@elmeragroup/internal": 0.2.0-canary.18
  "@arethetypeswrong/core": 0.18.5
  # The docs e2e axe audit of the chart demos, in all three engines. 4.14.0 is past the minimum
  # release age, so it needs no exclude entry.
  "@axe-core/playwright": 4.14.0
  "@base-ui/react": 1.9.0
  "@figma/plugin-typings": 1.141.0
  "@fontsource/roboto": 5.3.0
  "@internationalized/date": 3.12.4
  "@internationalized/string": 3.2.10
  "@paper-design/shaders-react": 0.0.81
  "@phosphor-icons/react": 2.1.10
  # The chart entry's API report. 7.59.4 is past the minimum release age, so it needs no exclude
  # entry. It pins TypeScript 5.9.3, which the packed chart type check also runs as the older
  # consumer compiler.
  "@microsoft/api-extractor": 7.59.4
  "@mdx-js/loader": 3.1.1
  "@next/mdx": 16.4.2
  "@next/playwright": 16.4.2
  "@shadcn/lint": 0.1.1
  # satori, which next/og bundles, pins this exact build; the OG card measures text with it.
  "@shuding/opentype.js": 1.4.0-beta.0
  # Mutation testing for the colour math and the chart palette roles. 10.0.0 is past the
  # minimum release age, so it needs no exclude entry.
  "@stryker-mutator/core": 10.0.0
  "@tailwindcss/cli": 4.3.3
  "@tailwindcss/postcss": 4.3.3
  "@tailwindcss/typography": 0.5.20
  "@tanstack/react-table": 9.2.4
  "@tanstack/react-virtual": 3.14.13
  "@types/node": 25.9.5
  "@types/d3-array": 3.2.2
  "@types/d3-shape": 3.2.0
  "@types/picomatch": 4.0.3
  "@types/pngjs": 6.0.5
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  "@vitest/browser-playwright": 5.0.0
  axe-core: 4.14.0
  # The chart screen-reader judges speak the DOM through it. 0.33.0 is past the minimum release
  # age, so it needs no exclude entry.
  "@guidepup/virtual-screen-reader": 0.33.0
  clsx: 2.1.1
  csstype: 3.2.3
  # The chart layouts. Exact pins, because the frozen d3 test vectors in the charts ground truth
  # come from these releases. Both are past the minimum release age.
  d3-array: 3.2.4
  d3-shape: 3.2.0
  effect: 4.0.6
  eslint-plugin-turbo: 2.10.12
  fast-check: 4.10.2
  "libphonenumber-js": 1.13.13
  next: 16.4.2
  oxc-parser: 0.148.0
  oxc-transform: 0.148.0
  oxfmt: 0.74.0
  oxlint: 1.89.0
  oxlint-tsgolint: 7.0.2004
  picomatch: 4.0.7
  # 8.0.0 is inside the minimum release age; 7.2.0 has the same API for pr-shots.
  pixelmatch: 7.2.0
  playwright: 1.63.0
  plop: 4.0.5
  pngjs: 7.0.0
  publint: 0.3.24
  quickjs-emscripten: 0.31.0
  rolldown: 1.2.15
  "sugar-high": 2.4.1
  react: 19.3.0
  react-aria: 3.52.1
  react-aria-components: 1.21.1
  react-dom: 19.3.0
  remark-frontmatter: 5.0.0
  remark-gfm: 4.0.1
  tailwind-merge: 3.7.0
  tailwind-variants: 3.3.1
  tailwindcss: 4.3.3
  tailwindcss-react-aria-components: 2.2.0
  tsdown: 0.23.2
  # tsrs runs every type-check, the Fuse type tests and Fuse's declaration emit. typescript 7.1
  # provides the JS API.
  tsrs: 0.20.0-ts7.1.0-beta
  turbo: 2.10.12
  tw-animate-css: 1.4.0
  typescript: 7.1.0-beta
  # Headless renders that judge the chart's stacked, expanded, grouped and horizontal bars. Both
  # are past the minimum release age.
  vega: 6.4.0
  vega-lite: 6.5.0
  vite: 8.3.0
  vitest: 5.0.0
  yaml: 2.9.1

autoInstallPeers: true

overrides:
  # @effect/platform-node declares a caret range here, which resolves to a release whose
  # effect peer is newer than the catalog's effect. Keep the whole Effect family on one version.
  "@effect/platform-node-shared": 4.0.6

allowBuilds:
  "@parcel/watcher": true

minimumReleaseAge: 4320

minimumReleaseAgeExclude:
  - effect@4.0.6
  # Canary line of the in-house tooling package; each bump names the exact version.
  - "@elmeragroup/internal@0.2.0-canary.18"
  # tsrs 0.20 (TypeScript 7.1 beta) is the version this internal canary depends on. The frozen
  # install checks every lockfile entry, including the optional platform binaries. Drop these
  # entries, and their temporary allowance in test/internal-package.test.mjs, once the versions
  # age past the guard on 2026-10-29T11:47Z.
  - tsrs@0.20.0-ts7.1.0-beta
  - "@tsrs/darwin-arm64@0.20.0-ts7.1.0-beta"
  - "@tsrs/darwin-x64@0.20.0-ts7.1.0-beta"
  - "@tsrs/linux-arm64-gnu@0.20.0-ts7.1.0-beta"
  - "@tsrs/linux-arm64-musl@0.20.0-ts7.1.0-beta"
  - "@tsrs/linux-x64-gnu@0.20.0-ts7.1.0-beta"
  - "@tsrs/linux-x64-musl@0.20.0-ts7.1.0-beta"
  - "@tsrs/win32-x64@0.20.0-ts7.1.0-beta"
