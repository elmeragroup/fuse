# Keeps the SHA-pinned third-party actions current. There is no npm ecosystem: several tests pin
# catalog versions and would fail on every dependency bump. The 3-day cooldown mirrors
# `minimumReleaseAge` in `pnpm-workspace.yaml`, so a compromised release has time to be pulled
# before it is proposed. Workflow-only bumps carry no changeset, hence the `no-changeset` label.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    labels:
      - no-changeset
    groups:
      github-actions:
        patterns:
          - "*"
