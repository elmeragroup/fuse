name: Merge

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Jobs without their own grant (checks, browser) run dependency code on every PR and push,
# so their token is read-only. The release and version jobs declare their own permissions,
# which replace this default for those jobs.
permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    # GitHub's default is 360 minutes; a hung `next start` or Playwright session would hold the
    # runner that long. 45 leaves headroom over a cold main run (publish-release.yml allows 40
    # for build, gates and publish).
    timeout-minutes: 45
    env:
      # This repo's changesets bot branch. GitHub stringifies job env values, so the steps
      # compare against 'true' explicitly; a bare `env.IS_SELF_RELEASE_PR` would be truthy
      # even when its value is the string "false".
      IS_SELF_RELEASE_PR: ${{ github.head_ref == 'changeset-release/main' && github.event.pull_request.head.repo.full_name == github.repository }}
      # A cache key is immutable once saved, so every attempt saves under its own key and
      # restores by prefix. Under PR churn these per-attempt entries can evict main's from the
      # 10GB repository cache (LRU); that only costs a cold run. The job id is spelled out
      # because `github.job` is null outside a job's steps.
      TURBO_CACHE_KEY: turbo-checks-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          cache: pnpm

      # setup-node already provides the devEngines.runtime pin, so pnpm skips downloading it again.
      - name: Install
        run: pnpm install --frozen-lockfile --no-runtime

      - name: oxfmt
        run: pnpm exec oxfmt --check

      # Turbo's local cache persists per job, so unchanged packages replay their cached
      # results. A PR restores from its own branch first and falls back to main's. Every run on
      # main (push or dispatch) verifies cold, so an under-declared task input cannot replay a
      # false green there.
      - name: Restore turbo cache
        if: ${{ github.ref != 'refs/heads/main' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: ${{ env.TURBO_CACHE_KEY }}
          restore-keys: |
            turbo-checks-${{ github.sha }}-
            turbo-checks-

      # turbo.json ci:checks minus the browser, e2e and packed-consumer checks, which the browser
      # job runs, so a unit or type failure does not wait on the browser suites.
      - name: turbo ci:checks (no browser)
        id: turbo-gate
        run: pnpm exec turbo run '//#lint:oxlint' '//#test:repo-policy' '//#type-check:scripts' type-check test test:types build package:check size-limit api:report
        env:
          TURBO_RUN_SUMMARY: "true"

      # size-limit writes its report before it passes or fails, so a breach still reaches the PR
      # comment. A main run's report is the base every PR compares against. A gate that failed
      # before size-limit leaves no report, and the upload skips.
      - name: Upload size report
        if: ${{ always() && steps.turbo-gate.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: size-report
          path: packages/fuse/.artifacts/size-report.json
          if-no-files-found: ignore
          # The report sits in `.artifacts/`, which the default excludes as hidden.
          include-hidden-files: true

      # Turbo never evicts, so keep only the entries this run used before the cache saves. A
      # red gate still saves, so its successful tasks replay on the next attempt; a run whose
      # gate never started has nothing to prune or save.
      - name: Prune turbo cache
        id: prune-turbo-cache
        if: ${{ always() && steps.turbo-gate.outcome != 'skipped' }}
        run: pnpm turbo-cache:prune

      - name: Save turbo cache
        if: ${{ always() && steps.prune-turbo-cache.outcome == 'success' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: ${{ env.TURBO_CACHE_KEY }}

      - name: Changeset presence
        if: ${{ github.event_name == 'pull_request' && env.IS_SELF_RELEASE_PR != 'true' && !contains(github.event.pull_request.labels.*.name, 'no-changeset') }}
        env:
          BASE_REF: ${{ github.base_ref }}
        run: pnpm exec changeset status --since="origin/$BASE_REF"

      - name: Validate stable release PR
        if: env.IS_SELF_RELEASE_PR == 'true' || github.ref == 'refs/heads/changeset-release/main'
        run: pnpm release check-pr

  # Posts each same-repository PR's size report against main's as one sticky comment. It runs
  # after `checks`, whatever its result, so a breach shows its size, and nothing waits on it, so
  # the required `checks` result never depends on commenting. It checks out only the comment
  # script and runs no dependency code, so it alone holds `pull-requests: write`. A fork PR's
  # token cannot comment, so it skips; its size-limit log in `checks` prints every size.
  size-comment:
    needs: checks
    if: ${{ !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      pull-requests: write
    steps:
      - name: Checkout the comment script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: packages/fuse/scripts

      # Node strips the script's types itself; nothing is installed.
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json

      # `checks` uploads no report when its gate failed before size-limit ran; then there is
      # nothing to post, and the PR keeps its last comment.
      - name: Download the PR's size report
        id: head-report
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: size-report
          path: ${{ runner.temp }}/head

      # The base is the newest main run that passed every job. Until one uploads a report, or
      # after it expires, the comment shows the PR's sizes without a comparison.
      - name: Post the size comment
        if: ${{ steps.head-report.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_REPORT: ${{ runner.temp }}/head/size-report.json
          BASE_DIR: ${{ runner.temp }}/base
          BODY: ${{ runner.temp }}/size-comment.md
        run: |
          base=()
          run_id="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow merge.yml --branch main --event push --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
          if [ -n "$run_id" ] && gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name size-report --dir "$BASE_DIR"; then
            base=("$BASE_DIR/size-report.json")
          fi
          node packages/fuse/scripts/size-comment.ts "$HEAD_REPORT" "${base[@]}" > "$BODY"
          # Taking the first id in bash, not through `head`, keeps pipefail off a closed pipe.
          ids="$(MARKER="$(head -n 1 "$BODY")" gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith($ENV.MARKER))) | .id')"
          comment_id="${ids%%$'\n'*}"
          if [ -n "$comment_id" ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$comment_id" -F "body=@$BODY" > /dev/null
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -F "body=@$BODY" > /dev/null
          fi

  # Every package's browser, packed-consumer and e2e tasks, docs' e2e suite against its own
  # `next start` included, in one job beside the checks job.
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # A cache key is immutable once saved, so every attempt saves under its own key and
      # restores by prefix. Under PR churn these per-attempt entries can evict main's from the
      # 10GB repository cache (LRU); that only costs a cold run. The job id is spelled out
      # because `github.job` is null outside a job's steps.
      TURBO_CACHE_KEY: turbo-browser-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      # The browser gate reads no git history; only the checks job needs it (changeset status --since).
      # The docs e2e choice below fetches the PR's base commit alone to compare its tree.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile --no-runtime

      # The browser download is keyed on the Playwright version pnpm resolved, so a catalog bump
      # misses once and every other run restores it. An unparsable version fails here rather than
      # becoming a constant key that restores stale browsers after every bump.
      - name: Resolve Playwright version
        id: playwright
        run: |
          version="$(pnpm --filter @elmeragroup/fuse exec playwright --version | awk '{print $2}')"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::unexpected playwright --version output: $version"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-webkit-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      # The `browser-engines` project and the docs time-zone hydration suite run in WebKit as well
      # as Chromium. Their system packages install in their own step, so either browser cache
      # result shares the package cache.
      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @elmeragroup/fuse exec playwright install chromium webkit

      # The system packages' .debs are cached too: fetching them from the Ubuntu mirror has
      # stalled runs for 40 minutes. A set only installs onto the dpkg state it was resolved
      # against, so the key names the runner image as well as the Playwright version that lists
      # the packages. The image variables come from the runner's environment, which the `env`
      # context does not include.
      - name: Resolve runner image
        id: runner-image
        run: |
          if [ -z "${ImageOS:-}" ] || [ -z "${ImageVersion:-}" ]; then echo "::error::ImageOS or ImageVersion is unset"; exit 1; fi
          echo "image=$ImageOS-$ImageVersion" >> "$GITHUB_OUTPUT"

      - name: Restore Playwright system packages
        id: deps-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/playwright-debs
          key: playwright-debs-${{ steps.runner-image.outputs.image }}-${{ steps.playwright.outputs.version }}

      # One bounded download on a miss; the script explains the limit. The step's limit is a
      # backstop over that attempt and the offline install.
      - name: Install Playwright system dependencies
        id: playwright-deps
        timeout-minutes: 6
        env:
          CACHE_HIT: ${{ steps.deps-cache.outputs.cache-hit }}
          DEBS: ${{ runner.temp }}/playwright-debs
        run: bash .github/scripts/install-playwright-deps.sh

      # The script offers a set only after downloading it on a miss. Any ref saves, so a branch
      # run restores its own entry. A PR falls back to main's, so it misses only while main has
      # none for its image.
      - name: Save Playwright system packages
        if: steps.playwright-deps.outputs.save == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/playwright-debs
          key: ${{ steps.deps-cache.outputs.cache-primary-key }}

      # Turbo's local cache persists per job, so unchanged packages replay their cached
      # results. A PR restores from its own branch first and falls back to main's. Every run on
      # main (push or dispatch) verifies cold, so an under-declared task input cannot replay a
      # false green there.
      - name: Restore turbo cache
        if: ${{ github.ref != 'refs/heads/main' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: ${{ env.TURBO_CACHE_KEY }}
          restore-keys: |
            turbo-browser-${{ github.sha }}-
            turbo-browser-

      # The studio and landing e2e files guard the docs site's own apps, not Fuse, so a PR runs
      # them only when it changes apps/docs or the lockfile. A push to main or a dispatch carries no
      # base commit and runs them all. The repository is public, so the fetch needs no credentials.
      - name: Choose the docs e2e files
        id: docs-e2e
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          site=run
          if [ -n "$BASE_SHA" ]; then
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
            if git diff --quiet FETCH_HEAD HEAD -- apps/docs pnpm-lock.yaml; then site=skip; fi
          fi
          echo "site=$site" >> "$GITHUB_OUTPUT"

      - name: turbo browser checks
        id: turbo-gate
        run: pnpm exec turbo run test:browser test:packed-consumer test:e2e
        env:
          TURBO_RUN_SUMMARY: "true"
          DOCS_E2E_SITE: ${{ steps.docs-e2e.outputs.site }}

      # Turbo never evicts, so keep only the entries this run used before the cache saves. A
      # red gate still saves, so its successful tasks replay on the next attempt; a run whose
      # gate never started has nothing to prune or save.
      - name: Prune turbo cache
        id: prune-turbo-cache
        if: ${{ always() && steps.turbo-gate.outcome != 'skipped' }}
        run: pnpm turbo-cache:prune

      - name: Save turbo cache
        if: ${{ always() && steps.prune-turbo-cache.outcome == 'success' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: ${{ env.TURBO_CACHE_KEY }}

  # Every activated push to main publishes a canary for the merged commit; a merged Version
  # Packages PR carries the stable bump and publishes the stable line.
  # Publishing and versioning stay off until activation sets RELEASE_ENABLED.
  # Gating versioning too matters: a Version Packages PR merged while publishing is off would
  # land its stable bump and consume its changesets, and the skipped release job would never
  # publish that version.
  # Both merge jobs gate publishing: a commit whose cold browser run failed must not ship a canary.
  # A `no-canary` label on the merged PR skips publication; the next published canary still
  # carries the commit. The bot release PR is exempt, because skipping its merge would land the
  # stable bump without publishing it.
  canary-opt-out:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.RELEASE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      skip: ${{ steps.labels.outputs.skip }}
    steps:
      # A push event carries no labels, so read them from the PR that merged as this commit. A
      # failed lookup fails the job, which skips publication visibly instead of guessing.
      - name: Read the merged PR's labels
        id: labels
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          skip="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq '[.[] | select(.merge_commit_sha == $ENV.GITHUB_SHA and .head.ref != "changeset-release/main") | .labels[].name] | any(. == "no-canary")')"
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

  release:
    needs: [checks, browser, canary-opt-out]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.RELEASE_ENABLED == 'true' && needs.canary-opt-out.outputs.skip != 'true'
    # The called workflow cannot hold more than this grant. npm's trusted publishing needs
    # `id-token: write` here and in publish-release.yml, and validates this file's name.
    permissions:
      contents: write
      pull-requests: read
      id-token: write
    uses: ./.github/workflows/publish-release.yml
    with:
      source_commit: ${{ github.sha }}
    # A called workflow sees only the secrets its caller passes. Its notify job announces the
    # release in Slack; npm authenticates over OIDC, so no npm token is passed.
    secrets:
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}

  version:
    needs: [checks, browser]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.RELEASE_ENABLED == 'true'
    permissions:
      contents: write
      pull-requests: write
      actions: write
    uses: ./.github/workflows/version-packages.yml

  # Every push to main that passes both gates ships to production; there is no staging step
  # between them (PR previews are the test surface, see preview.yml). The job stays skipped
  # until the Azure repository variables exist, so this workflow is safe ahead of the infra.
  #
  # Only this job holds the production identity. Its federated credential trusts
  # `repo:elmeragroup/fuse:ref:refs/heads/main`, so no pull_request run can obtain it.
  deploy-prod:
    needs: [checks, browser]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AZURE_CLIENT_ID_PROD != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    # Serialize deploys without cancelling one mid-rollout. A newer push replaces any deploy
    # still waiting, so production converges on the latest main.
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Azure login
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID_PROD }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID_PROD }}

      - name: Push image
        id: image
        uses: ./.github/actions/push-docs-image
        with:
          registry: ${{ vars.AZURE_ACR_NAME_PROD }}
          sha: ${{ github.sha }}
          # The build bakes this origin into its og:image URLs. It is the public domain, not the
          # app's URL on the Container Apps environment's default domain: that environment is
          # internal and resolves to a private IP, so link-preview scrapers cannot fetch from it.
          origin: https://fuse.elmeragroup.no

      # The production app runs in single revision mode: the new revision takes all traffic
      # once healthy and Container Apps retires the previous one.
      - name: Deploy revision
        env:
          APP: ${{ vars.PROD_CONTAINER_APP }}
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP_PROD }}
          IMAGE: ${{ steps.image.outputs.image }}
          ENVIRONMENT: ${{ vars.AZURE_CONTAINER_APPS_ENVIRONMENT_PROD }}
          REGISTRY: ${{ vars.AZURE_ACR_NAME_PROD }}
          MANAGED_IDENTITY_ID: ${{ vars.AZURE_MANAGED_IDENTITY_ID_PROD }}
          # Revision names are unique, so a re-run of the same commit needs a fresh suffix.
          SUFFIX: ${{ format('r-{0}-{1}', github.run_id, github.run_attempt) }}
        run: bash .github/scripts/docs-container-app.sh prod
