name: Merge

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Jobs without their own grant (checks, browser) run dependency code on every PR and push,
# so their token is read-only. The release and version jobs declare their own permissions,
# which replace this default for those jobs.
permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    # GitHub's default is 360 minutes; a hung `next start` or Playwright session would hold the
    # runner that long. 45 leaves headroom over a cold main run (publish-release.yml allows 40
    # for build, gates and publish).
    timeout-minutes: 45
    env:
      # This repo's changesets bot branch. GitHub stringifies job env values, so the steps
      # compare against 'true' explicitly; a bare `env.IS_SELF_RELEASE_PR` would be truthy
      # even when its value is the string "false".
      IS_SELF_RELEASE_PR: ${{ github.head_ref == 'changeset-release/main' && github.event.pull_request.head.repo.full_name == github.repository }}
      # A cache key is immutable once saved, so every attempt saves under its own key and
      # restores by prefix. Under PR churn these per-attempt entries can evict main's from the
      # 10GB repository cache (LRU); that only costs a cold run. The job id is spelled out
      # because `github.job` is null outside a job's steps.
      TURBO_CACHE_KEY: turbo-checks-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: oxfmt
        run: pnpm exec oxfmt --check

      # Turbo's local cache persists per job, so unchanged packages replay their cached
      # results. A PR restores from its own branch first and falls back to main's. Every run on
      # main (push or dispatch) verifies cold, so an under-declared task input cannot replay a
      # false green there.
      - name: Restore turbo cache
        if: ${{ github.ref != 'refs/heads/main' }}
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .turbo/cache
          key: ${{ env.TURBO_CACHE_KEY }}
          restore-keys: |
            turbo-checks-${{ github.sha }}-
            turbo-checks-

      # turbo.json ci:checks minus browser checks — a docs/unit failure should not
      # wait on the Chromium suite.
      - name: turbo ci:checks (no browser)
        id: turbo-gate
        run: pnpm exec turbo run '//#lint' '//#test:repo-policy' '//#type-check:scripts' type-check test test:types build package:check size-limit
        env:
          TURBO_RUN_SUMMARY: "true"

      # Turbo never evicts, so keep only the entries this run used before the cache saves. A
      # red gate still saves, so its successful tasks replay on the next attempt; a run whose
      # gate never started has nothing to prune or save.
      - name: Prune turbo cache
        id: prune-turbo-cache
        if: ${{ always() && steps.turbo-gate.outcome != 'skipped' }}
        run: pnpm turbo-cache:prune

      - name: Save turbo cache
        if: ${{ always() && steps.prune-turbo-cache.outcome == 'success' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .turbo/cache
          key: ${{ env.TURBO_CACHE_KEY }}

      - name: Changeset presence
        if: ${{ github.event_name == 'pull_request' && env.IS_SELF_RELEASE_PR != 'true' && !contains(github.event.pull_request.labels.*.name, 'no-changeset') }}
        env:
          BASE_REF: ${{ github.base_ref }}
        run: pnpm exec changeset status --since="origin/$BASE_REF"

      - name: Validate stable release PR
        if: env.IS_SELF_RELEASE_PR == 'true' || github.ref == 'refs/heads/changeset-release/main'
        run: pnpm release check-pr

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # A cache key is immutable once saved, so every attempt saves under its own key and
      # restores by prefix. Under PR churn these per-attempt entries can evict main's from the
      # 10GB repository cache (LRU); that only costs a cold run. The job id is spelled out
      # because `github.job` is null outside a job's steps.
      TURBO_CACHE_KEY: turbo-browser-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      # The browser gate reads no git history; only the checks job needs it (changeset status --since).
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # The browser download is keyed on the Playwright version pnpm resolved, so a catalog bump
      # misses once and every other run restores it. System packages are not cached; a hit
      # still installs them. An unparsable version fails here rather than becoming a constant key
      # that restores stale browsers after every bump.
      - name: Resolve Playwright version
        id: playwright
        run: |
          version="$(pnpm --filter @elmeragroup/fuse exec playwright --version | awk '{print $2}')"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::unexpected playwright --version output: $version"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @elmeragroup/fuse exec playwright install --with-deps chromium

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @elmeragroup/fuse exec playwright install-deps chromium

      # Turbo's local cache persists per job, so unchanged packages replay their cached
      # results. A PR restores from its own branch first and falls back to main's. Every run on
      # main (push or dispatch) verifies cold, so an under-declared task input cannot replay a
      # false green there.
      - name: Restore turbo cache
        if: ${{ github.ref != 'refs/heads/main' }}
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .turbo/cache
          key: ${{ env.TURBO_CACHE_KEY }}
          restore-keys: |
            turbo-browser-${{ github.sha }}-
            turbo-browser-

      - name: turbo browser checks
        id: turbo-gate
        run: pnpm exec turbo run test:browser test:packed-consumer
        env:
          TURBO_RUN_SUMMARY: "true"

      # Turbo never evicts, so keep only the entries this run used before the cache saves. A
      # red gate still saves, so its successful tasks replay on the next attempt; a run whose
      # gate never started has nothing to prune or save.
      - name: Prune turbo cache
        id: prune-turbo-cache
        if: ${{ always() && steps.turbo-gate.outcome != 'skipped' }}
        run: pnpm turbo-cache:prune

      - name: Save turbo cache
        if: ${{ always() && steps.prune-turbo-cache.outcome == 'success' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .turbo/cache
          key: ${{ env.TURBO_CACHE_KEY }}

  # Every activated push to main publishes a canary for the merged commit; a merged Version
  # Packages PR carries the stable bump and publishes the stable line.
  # Publishing and versioning stay off until activation sets RELEASE_ENABLED.
  # Gating versioning too matters: a Version Packages PR merged while publishing is off would
  # land its stable bump and consume its changesets, and the skipped release job would never
  # publish that version.
  # Both merge jobs gate publishing: a commit whose cold browser run failed must not ship a canary.
  # A `no-canary` label on the merged PR skips publication; the next published canary still
  # carries the commit. The bot release PR is exempt, because skipping its merge would land the
  # stable bump without publishing it.
  canary-opt-out:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.RELEASE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      skip: ${{ steps.labels.outputs.skip }}
    steps:
      # A push event carries no labels, so read them from the PR that merged as this commit. A
      # failed lookup fails the job, which skips publication visibly instead of guessing.
      - name: Read the merged PR's labels
        id: labels
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          skip="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq '[.[] | select(.merge_commit_sha == $ENV.GITHUB_SHA and .head.ref != "changeset-release/main") | .labels[].name] | any(. == "no-canary")')"
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

  release:
    needs: [checks, browser, canary-opt-out]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.RELEASE_ENABLED == 'true' && needs.canary-opt-out.outputs.skip != 'true'
    permissions:
      contents: write
      pull-requests: read
    uses: ./.github/workflows/publish-release.yml
    with:
      source_commit: ${{ github.sha }}
    secrets:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

  version:
    needs: [checks, browser]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.RELEASE_ENABLED == 'true'
    permissions:
      contents: write
      pull-requests: write
      actions: write
    uses: ./.github/workflows/version-packages.yml

  # Every push to main that passes both gates ships to production; there is no staging step
  # between them (PR previews are the test surface, see preview.yml). The job stays skipped
  # until the Azure repository variables exist, so this workflow is safe ahead of the infra.
  #
  # Only this job holds the production identity. Its federated credential trusts
  # `repo:elmeragroup/fuse:ref:refs/heads/main`, so no pull_request run can obtain it.
  deploy-prod:
    needs: [checks, browser]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AZURE_CLIENT_ID_PROD != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    # Serialize deploys without cancelling one mid-rollout. A newer push replaces any deploy
    # still waiting, so production converges on the latest main.
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Azure login
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID_PROD }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID_PROD }}

      - name: Push image
        id: image
        uses: ./.github/actions/push-docs-image
        with:
          registry: ${{ vars.AZURE_ACR_NAME_PROD }}
          sha: ${{ github.sha }}

      # The production app runs in single revision mode: the new revision takes all traffic
      # once healthy and Container Apps retires the previous one.
      - name: Deploy revision
        env:
          APP: ${{ vars.PROD_CONTAINER_APP }}
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP_PROD }}
          IMAGE: ${{ steps.image.outputs.image }}
          ENVIRONMENT: ${{ vars.AZURE_CONTAINER_APPS_ENVIRONMENT_PROD }}
          REGISTRY: ${{ vars.AZURE_ACR_NAME_PROD }}
          MANAGED_IDENTITY_ID: ${{ vars.AZURE_MANAGED_IDENTITY_ID_PROD }}
          # Revision names are unique, so a re-run of the same commit needs a fresh suffix.
          SUFFIX: ${{ format('r-{0}-{1}', github.run_id, github.run_attempt) }}
        run: bash .github/scripts/docs-container-app.sh prod
