name: Merge

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      # This repo's changesets bot branch. GitHub stringifies job env values, so the steps
      # compare against 'true' explicitly; a bare `env.IS_SELF_RELEASE_PR` would be truthy
      # even when its value is the string "false".
      IS_SELF_RELEASE_PR: ${{ github.head_ref == 'changeset-release/main' && github.event.pull_request.head.repo.full_name == github.repository }}
      # A cache key is immutable once saved, so every attempt saves under its own key and
      # restores by prefix. Under PR churn these per-attempt entries can evict main's from the
      # 10GB repository cache (LRU); that only costs a cold run. The job id is spelled out
      # because `github.job` is null outside a job's steps.
      TURBO_CACHE_KEY: turbo-checks-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: oxfmt
        run: pnpm exec oxfmt --check

      # Turbo's local cache persists per job, so unchanged packages replay their cached
      # results. A PR restores from its own branch first and falls back to main's. Every run on
      # main (push or dispatch) verifies cold, so an under-declared task input cannot replay a
      # false green there.
      - name: Restore turbo cache
        if: ${{ github.ref != 'refs/heads/main' }}
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .turbo/cache
          key: ${{ env.TURBO_CACHE_KEY }}
          restore-keys: |
            turbo-checks-${{ github.sha }}-
            turbo-checks-

      # turbo.json ci:checks minus browser checks — a docs/unit failure should not
      # wait on the Chromium suite.
      - name: turbo ci:checks (no browser)
        id: turbo-gate
        run: pnpm exec turbo run '//#lint' '//#test:repo-policy' '//#type-check:scripts' type-check test test:types build package:check size-limit
        env:
          TURBO_RUN_SUMMARY: "true"

      # Turbo never evicts, so keep only the entries this run used before the cache saves. A
      # red gate still saves, so its successful tasks replay on the next attempt; a run whose
      # gate never started has nothing to prune or save.
      - name: Prune turbo cache
        id: prune-turbo-cache
        if: ${{ always() && steps.turbo-gate.outcome != 'skipped' }}
        run: pnpm turbo-cache:prune

      - name: Save turbo cache
        if: ${{ always() && steps.prune-turbo-cache.outcome == 'success' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .turbo/cache
          key: ${{ env.TURBO_CACHE_KEY }}

      - name: Changeset presence
        if: ${{ github.event_name == 'pull_request' && env.IS_SELF_RELEASE_PR != 'true' && !contains(github.event.pull_request.labels.*.name, 'no-changeset') }}
        run: pnpm exec changeset status --since=origin/${{ github.base_ref }}

      - name: Validate stable release PR
        if: env.IS_SELF_RELEASE_PR == 'true' || github.ref == 'refs/heads/changeset-release/main'
        run: pnpm release check-pr

  browser:
    runs-on: ubuntu-latest
    env:
      # A cache key is immutable once saved, so every attempt saves under its own key and
      # restores by prefix. Under PR churn these per-attempt entries can evict main's from the
      # 10GB repository cache (LRU); that only costs a cold run. The job id is spelled out
      # because `github.job` is null outside a job's steps.
      TURBO_CACHE_KEY: turbo-browser-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm --filter @elmeragroup/fuse exec playwright install --with-deps chromium

      # Turbo's local cache persists per job, so unchanged packages replay their cached
      # results. A PR restores from its own branch first and falls back to main's. Every run on
      # main (push or dispatch) verifies cold, so an under-declared task input cannot replay a
      # false green there.
      - name: Restore turbo cache
        if: ${{ github.ref != 'refs/heads/main' }}
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .turbo/cache
          key: ${{ env.TURBO_CACHE_KEY }}
          restore-keys: |
            turbo-browser-${{ github.sha }}-
            turbo-browser-

      - name: turbo browser checks
        id: turbo-gate
        run: pnpm exec turbo run test:browser test:packed-consumer
        env:
          TURBO_RUN_SUMMARY: "true"

      # Turbo never evicts, so keep only the entries this run used before the cache saves. A
      # red gate still saves, so its successful tasks replay on the next attempt; a run whose
      # gate never started has nothing to prune or save.
      - name: Prune turbo cache
        id: prune-turbo-cache
        if: ${{ always() && steps.turbo-gate.outcome != 'skipped' }}
        run: pnpm turbo-cache:prune

      - name: Save turbo cache
        if: ${{ always() && steps.prune-turbo-cache.outcome == 'success' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .turbo/cache
          key: ${{ env.TURBO_CACHE_KEY }}

  # Every activated push to main publishes a canary for the merged commit; a merged Version
  # Packages PR carries the stable bump and publishes the stable line.
  # Publishing and versioning stay off until activation sets RELEASE_ENABLED.
  # Gating versioning too matters: a Version Packages PR merged while publishing is off would
  # land its stable bump and consume its changesets, and the skipped release job would never
  # publish that version.
  release:
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.RELEASE_ENABLED == 'true'
    permissions:
      contents: write
      pull-requests: read
    uses: ./.github/workflows/publish-release.yml
    with:
      source_commit: ${{ github.sha }}
    secrets:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

  version:
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.RELEASE_ENABLED == 'true'
    permissions:
      contents: write
      pull-requests: write
      actions: write
    uses: ./.github/workflows/version-packages.yml
