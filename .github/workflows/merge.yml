name: Merge

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Jobs without their own grant (checks, browser, figma-compare) run dependency code on every PR
# and push, so their token is read-only. The release and version jobs declare their own
# permissions, which replace this default for those jobs.
permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    # GitHub's default is 360 minutes; a hung `next start` or Playwright session would hold the
    # runner that long. 45 leaves headroom over a cold main run (publish-release.yml allows 40
    # for build, gates and publish).
    timeout-minutes: 45
    env:
      # This repo's changesets bot branch. GitHub stringifies job env values, so the steps
      # compare against 'true' explicitly; a bare `env.IS_SELF_RELEASE_PR` would be truthy
      # even when its value is the string "false".
      IS_SELF_RELEASE_PR: ${{ github.head_ref == 'changeset-release/main' && github.event.pull_request.head.repo.full_name == github.repository }}
      # A cache key is immutable once saved, so every attempt saves under its own key and
      # restores by prefix. Under PR churn these per-attempt entries can evict main's from the
      # 10GB repository cache (LRU); that only costs a cold run. The job id is spelled out
      # because `github.job` is null outside a job's steps.
      TURBO_CACHE_KEY: turbo-checks-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          cache: pnpm

      # setup-node already provides the devEngines.runtime pin, so pnpm skips downloading it again.
      - name: Install
        run: pnpm install --frozen-lockfile --no-runtime

      - name: oxfmt
        run: pnpm exec oxfmt --check

      # Turbo's local cache persists per job, so unchanged packages replay their cached
      # results. A PR restores from its own branch first and falls back to main's. Every run on
      # main (push or dispatch) verifies cold, so an under-declared task input cannot replay a
      # false green there.
      - name: Restore turbo cache
        if: ${{ github.ref != 'refs/heads/main' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: ${{ env.TURBO_CACHE_KEY }}
          restore-keys: |
            turbo-checks-${{ github.sha }}-
            turbo-checks-

      # turbo.json ci:checks minus the browser, e2e and packed-consumer checks, which the browser
      # job runs, and fuse-figma's self-check, which the figma-compare job runs, so a unit or type
      # failure does not wait on the browser suites.
      - name: turbo ci:checks (no browser)
        id: turbo-gate
        run: pnpm exec turbo run '//#lint:oxlint' '//#test:repo-policy' '//#type-check:scripts' type-check test test:types build package:check api:report
        env:
          TURBO_RUN_SUMMARY: "true"

      # Turbo never evicts, so keep only the entries this run used before the cache saves. A
      # red gate still saves, so its successful tasks replay on the next attempt; a run whose
      # gate never started has nothing to prune or save.
      - name: Prune turbo cache
        id: prune-turbo-cache
        if: ${{ always() && steps.turbo-gate.outcome != 'skipped' }}
        run: pnpm turbo-cache:prune

      - name: Save turbo cache
        if: ${{ always() && steps.prune-turbo-cache.outcome == 'success' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: ${{ env.TURBO_CACHE_KEY }}

      - name: Changeset presence
        if: ${{ github.event_name == 'pull_request' && env.IS_SELF_RELEASE_PR != 'true' && !contains(github.event.pull_request.labels.*.name, 'no-changeset') }}
        env:
          BASE_REF: ${{ github.base_ref }}
        run: pnpm exec changeset status --since="origin/$BASE_REF"

      - name: Validate stable release PR
        if: env.IS_SELF_RELEASE_PR == 'true' || github.ref == 'refs/heads/changeset-release/main'
        run: pnpm release check-pr

  # Every package's browser, packed-consumer and e2e tasks, docs' e2e suite against its own
  # `next start` included, in one job beside the checks job.
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # A cache key is immutable once saved, so every attempt saves under its own key and
      # restores by prefix. Under PR churn these per-attempt entries can evict main's from the
      # 10GB repository cache (LRU); that only costs a cold run. The job id is spelled out
      # because `github.job` is null outside a job's steps.
      TURBO_CACHE_KEY: turbo-browser-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      # The browser gate reads no git history; only the checks job needs it (changeset status --since).
      # The docs e2e choice below fetches the PR's base commit alone to compare its tree.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile --no-runtime

      # The `browser-engines` project and the docs time-zone hydration suite run in WebKit as well
      # as Chromium.
      - name: Set up Playwright
        uses: ./.github/actions/setup-playwright
        with:
          browsers: chromium webkit

      # Turbo's local cache persists per job, so unchanged packages replay their cached
      # results. A PR restores from its own branch first and falls back to main's. Every run on
      # main (push or dispatch) verifies cold, so an under-declared task input cannot replay a
      # false green there.
      - name: Restore turbo cache
        if: ${{ github.ref != 'refs/heads/main' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: ${{ env.TURBO_CACHE_KEY }}
          restore-keys: |
            turbo-browser-${{ github.sha }}-
            turbo-browser-

      # The studio and landing e2e files guard the docs site's own apps, not Fuse, so a PR runs
      # them only when it changes apps/docs or the lockfile. A push to main or a dispatch carries no
      # base commit and runs them all. The repository is public, so the fetch needs no credentials.
      - name: Choose the docs e2e files
        id: docs-e2e
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          site=run
          if [ -n "$BASE_SHA" ]; then
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
            if git diff --quiet FETCH_HEAD HEAD -- apps/docs pnpm-lock.yaml; then site=skip; fi
          fi
          echo "site=$site" >> "$GITHUB_OUTPUT"

      - name: turbo browser checks
        id: turbo-gate
        run: pnpm exec turbo run test:browser test:packed-consumer test:e2e
        env:
          TURBO_RUN_SUMMARY: "true"
          DOCS_E2E_SITE: ${{ steps.docs-e2e.outputs.site }}

      # Turbo never evicts, so keep only the entries this run used before the cache saves. A
      # red gate still saves, so its successful tasks replay on the next attempt; a run whose
      # gate never started has nothing to prune or save.
      - name: Prune turbo cache
        id: prune-turbo-cache
        if: ${{ always() && steps.turbo-gate.outcome != 'skipped' }}
        run: pnpm turbo-cache:prune

      - name: Save turbo cache
        if: ${{ always() && steps.prune-turbo-cache.outcome == 'success' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: ${{ env.TURBO_CACHE_KEY }}

  # fuse-figma's `figma:compare --self-check` (packages/fuse-figma/README.md, "Comparing with the
  # browser"). It renders every kit cell twice in Chromium, about 2 minutes on 4 vCPUs, in a job of
  # its own so it can pass in seconds when what it reads did not change
  # (.github/figma-compare-inputs.txt). On a pull request turbo also replays it until its task
  # inputs change (packages/fuse-figma/turbo.json). It guards the Figma kit's tooling, not the
  # published package, so publishing and deploys do not wait on it.
  figma-compare:
    runs-on: ubuntu-latest
    # A hang guard: setup and a cold render take minutes.
    timeout-minutes: 20
    env:
      # Per-attempt keys, restored by prefix, as in the browser job.
      TURBO_CACHE_KEY: turbo-figma-compare-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A pull request compares with its base commit and a push to main with the commit it started
      # from, so a docs-only change passes here in seconds. A manual run always renders. The
      # script and its pathspecs say what counts.
      - name: Decide whether the self-check's inputs changed
        id: affected
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bash .github/scripts/figma-compare-affected.sh

      - name: Setup pnpm
        if: steps.affected.outputs.run == 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        if: steps.affected.outputs.run == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install
        if: steps.affected.outputs.run == 'true'
        run: pnpm install --frozen-lockfile --no-runtime

      - name: Set up Playwright
        if: steps.affected.outputs.run == 'true'
        uses: ./.github/actions/setup-playwright
        with:
          browsers: chromium

      - name: Restore turbo cache
        if: ${{ steps.affected.outputs.run == 'true' && github.ref != 'refs/heads/main' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: ${{ env.TURBO_CACHE_KEY }}
          restore-keys: |
            turbo-figma-compare-${{ github.sha }}-
            turbo-figma-compare-

      - name: turbo figma:compare self-check
        id: turbo-gate
        if: steps.affected.outputs.run == 'true'
        run: pnpm exec turbo run test:compare
        env:
          TURBO_RUN_SUMMARY: "true"

      # The log names each cell that differs; the report shows their pictures. The self-check's
      # fake snapshot holds every cell's PNG again, so it stays behind.
      - name: Upload the self-check report
        if: ${{ failure() && steps.turbo-gate.outcome == 'failure' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: figma-compare-self-check
          path: |
            packages/fuse-figma/.cache/figma-compare/self-check/report.html
            packages/fuse-figma/.cache/figma-compare/self-check/report.json
            packages/fuse-figma/.cache/figma-compare/self-check/cells/
          if-no-files-found: ignore
          retention-days: 7

      - name: Prune turbo cache
        id: prune-turbo-cache
        if: ${{ always() && steps.turbo-gate.outcome != 'skipped' }}
        run: pnpm turbo-cache:prune

      - name: Save turbo cache
        if: ${{ always() && steps.prune-turbo-cache.outcome == 'success' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: ${{ env.TURBO_CACHE_KEY }}

  # Every activated push to main publishes a canary for the merged commit; a merged Version
  # Packages PR carries the stable bump and publishes the stable line.
  # Publishing and versioning stay off until activation sets RELEASE_ENABLED.
  # Gating versioning too matters: a Version Packages PR merged while publishing is off would
  # land its stable bump and consume its changesets, and the skipped release job would never
  # publish that version.
  # Both merge jobs gate publishing: a commit whose cold browser run failed must not ship a canary.
  # A push skips publication only when every PR it merged carries the `no-canary` label; a stack
  # merge lands several PRs in one push. The next published canary still carries the commits.
  # The bot release PR is exempt, because skipping its merge would land the stable bump without
  # publishing it.
  canary-opt-out:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.RELEASE_ENABLED == 'true'
    runs-on: ubuntu-latest
    # A lookup's retries through a GitHub rate limit take up to 9 minutes
    # (tooling/canary-opt-out/src/github-pulls.ts), on top of the install.
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    outputs:
      skip: ${{ steps.labels.outputs.skip }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      # No pnpm cache: this job installs a fraction of the store and often finishes first, so it
      # would save that partial store under the lockfile's key, which a cache never replaces, and
      # every full install would restore it. The install takes seconds from the registry.
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json

      # The job holds a token, so it installs only the step's runtime dependencies, without their
      # install scripts.
      - name: Install
        run: pnpm install --frozen-lockfile --no-runtime --ignore-scripts --prod --filter @elmeragroup/canary-opt-out

      # A push event carries no labels, so the step reads them from the PR that merged as each
      # pushed commit (tooling/canary-opt-out/src/canary-decision.ts holds the rule). A failed
      # lookup writes no output and fails the job, which skips publication visibly instead of
      # guessing.
      - name: Read the merged PRs' labels
        id: labels
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tooling/canary-opt-out/src/canary-opt-out.ts

  release:
    needs: [checks, browser, canary-opt-out]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.RELEASE_ENABLED == 'true' && needs.canary-opt-out.outputs.skip != 'true'
    # The called workflow cannot hold more than this grant. npm's trusted publishing needs
    # `id-token: write` here and in publish-release.yml, and validates this file's name.
    permissions:
      contents: write
      pull-requests: read
      id-token: write
    uses: ./.github/workflows/publish-release.yml
    with:
      source_commit: ${{ github.sha }}
    # A called workflow sees only the secrets its caller passes. Its notify job announces the
    # release in Slack; npm authenticates over OIDC, so no npm token is passed.
    secrets:
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}

  version:
    needs: [checks, browser]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.RELEASE_ENABLED == 'true'
    permissions:
      contents: write
      pull-requests: write
      actions: write
    uses: ./.github/workflows/version-packages.yml

  # Every push to main that passes both gates ships to production; there is no staging step
  # between them (PR previews are the test surface, see preview.yml). The job stays skipped
  # until the Azure repository variables exist, so this workflow is safe ahead of the infra.
  #
  # Only this job holds the production identity. Its federated credential trusts
  # `repo:elmeragroup/fuse:ref:refs/heads/main`, so no pull_request run can obtain it.
  deploy-prod:
    needs: [checks, browser]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AZURE_CLIENT_ID_PROD != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    # Serialize deploys without cancelling one mid-rollout. A newer push replaces any deploy
    # still waiting, so production converges on the latest main.
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Azure login
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID_PROD }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID_PROD }}

      - name: Push image
        id: image
        uses: ./.github/actions/push-docs-image
        with:
          registry: ${{ vars.AZURE_ACR_NAME_PROD }}
          sha: ${{ github.sha }}
          # The build bakes this origin into its og:image URLs. It is the public domain, not the
          # app's URL on the Container Apps environment's default domain: that environment is
          # internal and resolves to a private IP, so link-preview scrapers cannot fetch from it.
          origin: https://fuse.elmeragroup.no

      # The production app runs in single revision mode: the new revision takes all traffic
      # once healthy and Container Apps retires the previous one.
      - name: Deploy revision
        env:
          APP: ${{ vars.PROD_CONTAINER_APP }}
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP_PROD }}
          IMAGE: ${{ steps.image.outputs.image }}
          ENVIRONMENT: ${{ vars.AZURE_CONTAINER_APPS_ENVIRONMENT_PROD }}
          REGISTRY: ${{ vars.AZURE_ACR_NAME_PROD }}
          MANAGED_IDENTITY_ID: ${{ vars.AZURE_MANAGED_IDENTITY_ID_PROD }}
          # Revision names are unique, so a re-run of the same commit needs a fresh suffix.
          SUFFIX: ${{ format('r-{0}-{1}', github.run_id, github.run_attempt) }}
        run: bash .github/scripts/docs-container-app.sh prod
