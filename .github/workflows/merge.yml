name: Merge

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: oxfmt
        run: pnpm exec oxfmt --check

      # turbo.json ci:checks minus browser checks — a docs/unit failure should not
      # wait on the Chromium suite.
      - name: turbo ci:checks (no browser)
        run: pnpm exec turbo run '//#lint' '//#test:repo-policy' '//#type-check:scripts' type-check test test:types build package:check size-limit

      - name: Changeset presence
        if: ${{ github.event_name == 'pull_request' && !startsWith(github.head_ref, 'changeset-release/') && !contains(github.event.pull_request.labels.*.name, 'no-changeset') }}
        run: pnpm exec changeset status --since=origin/${{ github.base_ref }}

      - name: Validate stable release PR
        if: github.head_ref == 'changeset-release/main' || github.ref == 'refs/heads/changeset-release/main'
        run: pnpm release:check-pr

  browser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm --filter @elmeragroup/ui exec playwright install --with-deps chromium

      - name: turbo browser checks
        run: pnpm exec turbo run test:browser test:packed-consumer

  # Every push to main publishes a canary for the merged commit; a merged Version Packages PR
  # carries the stable bump and publishes the stable line (release.md §2, §3). Publishing stays
  # off until activation sets RELEASE_ENABLED (release.md §8).
  release:
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.RELEASE_ENABLED == 'true'
    permissions:
      contents: write
      pull-requests: read
    uses: ./.github/workflows/publish-release.yml
    with:
      source_commit: ${{ github.sha }}
    secrets:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      RELEASE_GITHUB_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN }}

  version:
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      pull-requests: write
      actions: write
    uses: ./.github/workflows/version-packages.yml
