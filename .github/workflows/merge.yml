name: Merge

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      # This repo's changesets bot branch. GitHub stringifies job env values, so the steps
      # compare against 'true' explicitly; a bare `env.IS_SELF_RELEASE_PR` would be truthy
      # even when its value is the string "false".
      IS_SELF_RELEASE_PR: ${{ github.head_ref == 'changeset-release/main' && github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: oxfmt
        run: pnpm exec oxfmt --check

      # turbo.json ci:checks minus browser checks — a docs/unit failure should not
      # wait on the Chromium suite.
      - name: turbo ci:checks (no browser)
        run: pnpm exec turbo run '//#lint' '//#test:repo-policy' '//#type-check:scripts' type-check test test:types build package:check size-limit

      - name: Changeset presence
        if: ${{ github.event_name == 'pull_request' && env.IS_SELF_RELEASE_PR != 'true' && !contains(github.event.pull_request.labels.*.name, 'no-changeset') }}
        run: pnpm exec changeset status --since=origin/${{ github.base_ref }}

      - name: Validate stable release PR
        if: env.IS_SELF_RELEASE_PR == 'true' || github.ref == 'refs/heads/changeset-release/main'
        run: pnpm release check-pr

  browser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm --filter @elmeragroup/fuse exec playwright install --with-deps chromium

      - name: turbo browser checks
        run: pnpm exec turbo run test:browser test:packed-consumer

  # Every activated push to main publishes a canary for the merged commit; a merged Version
  # Packages PR carries the stable bump and publishes the stable line.
  # Publishing and versioning stay off until activation sets RELEASE_ENABLED.
  # Gating versioning too matters: a Version Packages PR merged while publishing is off would
  # land its stable bump and consume its changesets, and the skipped release job would never
  # publish that version.
  release:
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.RELEASE_ENABLED == 'true'
    permissions:
      contents: write
      pull-requests: read
    uses: ./.github/workflows/publish-release.yml
    with:
      source_commit: ${{ github.sha }}
    secrets:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

  version:
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.RELEASE_ENABLED == 'true'
    permissions:
      contents: write
      pull-requests: write
      actions: write
    uses: ./.github/workflows/version-packages.yml

  # Every push to main that passes both gates ships to production; there is no staging step
  # between them (PR previews are the test surface, see preview.yml). The job stays skipped
  # until the Azure repository variables exist, so this workflow is safe ahead of the infra.
  #
  # Only this job holds the production identity. Its federated credential trusts
  # `repo:elmeragroup/fuse:ref:refs/heads/main`, so no pull_request run can obtain it.
  deploy-prod:
    needs: [checks, browser]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AZURE_CLIENT_ID_PROD != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    # Serialize deploys without cancelling one mid-rollout. A newer push replaces any deploy
    # still waiting, so production converges on the latest main.
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID_PROD }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Push image
        id: image
        uses: ./.github/actions/push-docs-image
        with:
          registry: ${{ vars.AZURE_ACR_NAME }}
          sha: ${{ github.sha }}

      # The production app runs in single revision mode: the new revision takes all traffic
      # once healthy and Container Apps retires the previous one.
      - name: Deploy revision
        env:
          APP: ${{ vars.PROD_CONTAINER_APP }}
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          IMAGE: ${{ steps.image.outputs.image }}
          # Revision names are unique, so a re-run of the same commit needs a fresh suffix.
          SUFFIX: ${{ format('{0}-{1}', github.run_id, github.run_attempt) }}
        run: |
          az containerapp update \
            --name "$APP" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$IMAGE" \
            --revision-suffix "$SUFFIX"
