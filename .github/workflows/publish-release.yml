name: Publish Release

# A workflow_call publishes a checked commit and never retries; a workflow_dispatch retries a
# recorded archive and never publishes (record_tag is empty on the call path).
on:
  workflow_call:
    inputs:
      source_commit:
        required: true
        type: string
    secrets:
      NPM_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      record_tag:
        description: "Prepared release to retry: v0.1.2 or canary-<full commit SHA>"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: read

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    concurrency:
      # `queue: max` keeps waiting publications instead of replacing the newest one, so a
      # stable Version Packages merge cannot be silently dropped by a later canary commit.
      group: npm-release
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_commit || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # test:packed-consumer launches Playwright Chromium; this fresh runner has none installed. A
      # retry dispatch carries a record tag and restores recorded bytes, so only the publishing
      # path needs the browser.
      - name: Install Playwright Chromium
        if: inputs.record_tag == ''
        run: pnpm --filter @elmeragroup/fuse exec playwright install --with-deps chromium

      # GH_TOKEN authenticates the engine's GitHub API calls; NPM_TOKEN remains until the OIDC pivot (release.md §6).
      - name: Publish checked commit or retry recorded archive
        env:
          GH_TOKEN: ${{ github.token }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          RECORD_TAG: ${{ inputs.record_tag }}
        run: |
          if [ -n "$RECORD_TAG" ]; then
            pnpm release retry "$RECORD_TAG"
          else
            pnpm release publish "$SOURCE_COMMIT"
          fi
