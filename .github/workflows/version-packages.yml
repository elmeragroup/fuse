name: Version Packages

on:
  workflow_call:

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      # Checks can finish out of push order. Keep every waiting job and never let an older
      # completion cancel a newer update; stale jobs skip the action after checking main first.
      group: version-packages
      cancel-in-progress: false
      queue: max
    permissions:
      contents: write
      pull-requests: write
    outputs:
      pr-number: ${{ steps.changesets.outputs.pr-number }}
    steps:
      # The guard runs before checkout and install: a superseded job has no work to do, and
      # `gh` is preinstalled on the runner, so nothing is gained by provisioning the repo first.
      - name: Check current main commit
        id: current-main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          main_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          if [ "$GITHUB_SHA" = "$main_sha" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "Skipping version preparation for superseded commit $GITHUB_SHA"
          fi

      # changesets/action commits and force-updates the release branch through the GitHub API
      # with its `github-token` (`push-with-git-cli` is off), so the checkout keeps no token.
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Version Packages PR
        id: changesets
        if: steps.current-main.outputs.current == 'true'
        # Keep the root action: it skips `version-script` entirely when there are no changesets, so
        # Changesets CLI v3 is never asked to version an empty release (which exits 1). Do not switch
        # to `changesets/action/version@v2` without an equivalent guard.
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: pnpm release:version
          pr-title: Version Packages
          commit-message: "chore: version packages"
          github-token: ${{ github.token }}

  # Only this job can dispatch workflows; the version job, which installs dependencies,
  # cannot. The PR was opened with GITHUB_TOKEN, so its push did not start a merge run.
  dispatch-checks:
    needs: version
    if: needs.version.outputs.pr-number
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Run checks on the bot-created release PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run merge.yml --repo "$GITHUB_REPOSITORY" --ref changeset-release/main
